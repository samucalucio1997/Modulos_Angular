<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-8">
      <h2>Cadastrar Produto</h2>
    </div>
    <div class="col-4 text-right">
      <button 
        nz-button 
        nzType="default" 
        nzSize="large"
        routerLink="../../gerenciar-estoque">
        <i nz-icon nzType="arrow-left" nzTheme="outline"></i>
        Voltar para Lista
      </button>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <nz-card nzTitle="Informações do Produto" [nzBordered]="false">
        <form [formGroup]="produtoForm" (ngSubmit)="onSubmit()">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="nome" class="form-label">Nome <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control" 
                id="nome" 
                formControlName="nome" 
                placeholder="Nome do produto"
                [class.is-invalid]="produtoForm.get('nome')?.invalid && produtoForm.get('nome')?.touched" />
              <div class="invalid-feedback" *ngIf="produtoForm.get('nome')?.invalid && produtoForm.get('nome')?.touched">
                Nome é obrigatório e deve ter pelo menos 2 caracteres.
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="codigo" class="form-label">Código <span class="text-danger">*</span></label>
              <input 
                type="text" 
                class="form-control" 
                id="codigo" 
                formControlName="codigo" 
                placeholder="Código do produto"
                [class.is-invalid]="produtoForm.get('codigo')?.invalid && produtoForm.get('codigo')?.touched" />
              <div class="invalid-feedback" *ngIf="produtoForm.get('codigo')?.invalid && produtoForm.get('codigo')?.touched">
                Código é obrigatório.
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="preco" class="form-label">Preço <span class="text-danger">*</span></label>
              <input 
                type="number" 
                class="form-control" 
                id="preco" 
                formControlName="preco" 
                placeholder="Preço"
                step="0.01"
                min="0"
                [class.is-invalid]="produtoForm.get('preco')?.invalid && produtoForm.get('preco')?.touched" />
              <div class="invalid-feedback" *ngIf="produtoForm.get('preco')?.invalid && produtoForm.get('preco')?.touched">
                Preço é obrigatório e deve ser maior que zero.
              </div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="quantidade" class="form-label">Quantidade</label>
              <input 
                type="number" 
                class="form-control" 
                id="quantidade" 
                formControlName="quantidade" 
                placeholder="Quantidade em estoque"
                min="0"
                [class.is-invalid]="produtoForm.get('quantidade')?.invalid && produtoForm.get('quantidade')?.touched" />
              <div class="invalid-feedback" *ngIf="produtoForm.get('quantidade')?.invalid && produtoForm.get('quantidade')?.touched">
                Quantidade deve ser maior ou igual a zero.
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-12 mb-3">
              <label for="descricao" class="form-label">Descrição</label>
              <textarea 
                class="form-control" 
                id="descricao" 
                formControlName="descricao" 
                rows="3" 
                placeholder="Descrição do produto"></textarea>
            </div>
          </div>
          <div class="text-right mt-3">
            <button nz-button nzType="primary" [disabled]="produtoForm.invalid">
              <i nz-icon nzType="plus" nzTheme="outline"></i>
              Cadastrar Produto
            </button>
          </div>
        </form>
      </nz-card>
    </div>
  </div>
</div>
