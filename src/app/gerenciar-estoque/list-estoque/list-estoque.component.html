<div class="container-fluid">
  <div class="row mb-4">
    <div class="col-8">
      <h2>Lista de Estoque</h2>
    </div>
    <div class="col-4 text-right">
      <button 
      nz-button 
      nzType="primary" 
      nzSize="large"
      (click)="abrirModal()"
      >
      <i nz-icon nzType="plus" nzTheme="outline"></i>
      Cadastrar Produto
      </button>
    </div>
  </div>

  <div class="row mb-4">
    <div class="col-12">
      <nz-card nzTitle="Filtros" [nzBordered]="false" [formGroup]="filtrosForm">
         <div class="row">
          <div class="col-md-3 mb-3">
            <label nz-typography>Filtrar por Categoria:</label>
            <nz-select
              formControlName="categoriaSelecionada"
              nzPlaceHolder="Selecione uma categoria"
              nzAllowClear
              style="width: 100%">
              <nz-option nzValue="null" nzLabel="Todas as categorias"></nz-option>
              <nz-option 
                *ngFor="let categoria of categorias | keyvalue" 
                [nzValue]="categoria.value" 
                [nzLabel]="categoria.value">
              </nz-option>
            </nz-select>
          </div>
          
          <div class="col-md-3 mb-3">
            <label nz-typography>Preço Mínimo:</label>
            <nz-input-number
              formControlName="precoMinimo"
              nzPlaceHolder="Preço mínimo"
              [nzMin]="0"
              [nzStep]="0.01"
              style="width: 100%">
            </nz-input-number>
          </div>
          
          <div class="col-md-3 mb-3">
            <label nz-typography>Preço Máximo:</label>
            <nz-input-number
              formControlName="precoMaximo"
              nzPlaceHolder="Preço máximo"
              [nzMin]="0"
              [nzStep]="0.01"
              style="width: 100%">
            </nz-input-number>
          </div>
          
          <div class="col-md-3 mb-3 d-flex align-items-end">
            <button 
              nz-button 
              nzType="default" 
              nzSize="large"
              (click)="limparFiltros()"
              style="width: 100%">
              <i nz-icon nzType="clear" nzTheme="outline"></i>
              Limpar Filtros
            </button>
          </div>
        </div>
      </nz-card>
    </div>
  </div>

  <!-- Tabela -->
  <div class="row">
    <div class="col-12">
      <nz-spin [nzSpinning]="carregando" nzTip="Carregando produtos...">
        <nz-card nzTitle="Produtos em Estoque" [nzBordered]="true">
          <nz-table 
            #table
            [nzData]="produtos"
            [nzPageIndex]="pageIndex"
            [nzPageSize]="pageSize"
            [nzTotal]="totalElements"
            (nzPageIndexChange)="searchDataPage($event)"
            (nzPageSizeChange)="searchDataSize($event)"
            nzShowSizeChanger
            nzShowPagination
            [nzFrontPagination]="false"
            nzBordered
            >
            <thead>
              <tr>
                <th nzWidth="80px">Matrícula</th>
                <th nzWidth="200px">Nome do Produto</th>
                <th nzWidth="120px">Preço</th>
                <th nzWidth="150px">Categoria</th>
                <th nzWidth="120px">Estoque</th>
                <th nzWidth="100px">Ações</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let produto of produtos; let i = index">
                <td>{{ produto.id || 'N/A' }}</td>
                <td>{{ produto.nome || 'N/A' }}</td>
                <td>
                  <span class="text-success font-weight-bold">
                    R$ {{ produto.precoUni | number:'1.2-2' }}
                  </span>
                </td>
                <td>
                  <nz-tag>
                    {{ produto?.categoria || "-" }}
                  </nz-tag>
                </td>
                <td>
                  <span>
                    {{ produto.qtd || 'N/A' }}
                  </span>
                </td>
                <td>
                  <button nz-button nzType="link" nzSize="small" (click)="editProduto(produto)">
                    <i nz-icon nzType="edit" nzTheme="outline"></i>
                  </button>
                  <button nz-button nzType="link" nzSize="small" nzDanger>
                    <i nz-icon nzType="delete" nzTheme="outline"></i>
                  </button>
                </td>
              </tr>
              <tr *ngIf="!produtos || produtos.length === 0">
                <td colspan="6" class="text-center">Nenhum produto encontrado</td>
              </tr>
            </tbody>
          </nz-table>
        </nz-card>
      </nz-spin>
    </div>
  </div>
</div>
