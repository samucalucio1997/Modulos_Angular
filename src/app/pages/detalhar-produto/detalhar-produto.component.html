<nz-card nzTitle="Detalhes do Produto" nzBordered>
    <nz-row [nzGutter]="16">
        <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="8">
            <img nz-image [src]="viewImage(produtoDto.imagens || [])" alt="Produto" style="width: 100%;">
        </nz-col>
        <nz-col [nzXs]="24" [nzSm]="12" [nzMd]="16">
            <h2>{{ produtoDto.nome }} </h2>
            <p><strong>Categoria:</strong> {{ produtoDto.categoria }}</p>
            
            <nz-divider></nz-divider>
            
            <h3 nz-typography nzType="warning">R$ {{ produtoDto.precoUni }}</h3>
            <!-- <p><strong>Estoque:</strong> <nz-badge [nzCount]="produtoDto.qtd" nzColor="#87d068"></nz-badge></p> -->
            
            <nz-divider></nz-divider>
            
            <p><strong>Descrição:</strong></p>
            <p>{{ produtoDto.descricao }}</p>
            
            <nz-space>
                <button nz-button nzType="primary" nzSize="large">
                    <i nz-icon nzType="shopping-cart" nzTheme="outline"></i>
                    Adicionar ao Carrinho
                </button>
                <button nz-button nzSize="large">
                    <i nz-icon nzType="heart" nzTheme="outline"></i>
                    Favoritar
                </button>
            </nz-space>
        </nz-col>
    </nz-row>

</nz-card>
