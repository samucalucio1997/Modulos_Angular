<div class="dashboard-content">
  <h1>Bem-vindo ao Sistema E-commerce amigo</h1>
  <p>Selecione uma opção no menu lateral para começar.</p>
  
  <div class="dashboard-cards" *ngFor="let modulo of modulos">
    <nz-card [nzTitle]="modulo.moduleName" nzHoverable style="width: 300px;">
      <p>{{ modulo.descricao }}</p>
      <button nz-button nzType="primary" [routerLink]="modulo.router">
      {{ modulo.descricao }}
      </button>
    </nz-card>
  </div>
</div>
