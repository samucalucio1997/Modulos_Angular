<nz-layout class="app-layout">

  <!-- SIDEBAR -->
  <nz-sider
    class="menu-sidebar"
    nzCollapsible
    nzWidth="260px"
    nzBreakpoint="md"
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null">

    <!-- LOGO -->
    <div class="sidebar-logo">
      <span class="logo-icon">📦</span>
      <span *ngIf="!isCollapsed" class="logo-text">StockFlow</span>
    </div>

    <!-- MENU -->
    <ul nz-menu nzTheme="dark" nzMode="inline" [nzInlineCollapsed]="isCollapsed">
      <li nz-menu-item *ngFor="let modulo of modulos" nzMatchRouter>
        <span nz-icon nzType="appstore"></span>
        <span>{{ modulo.moduleName }}</span>
        <a [routerLink]="'/welcome/' + modulo.router"></a>
      </li>
    </ul>

  </nz-sider>

  <!-- CONTEÚDO -->
  <nz-layout>

    <!-- HEADER -->
    <nz-header class="app-header">

      <div class="left">
        <span class="trigger" (click)="handleTuggle()">
          <span nz-icon [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"></span>
        </span>

        <span class="page-title">Dashboard</span>
      </div>

      <div class="right">

        <!-- NOTIFICAÇÃO -->
        <span nz-icon nzType="bell" class="header-icon"></span>

        <!-- USUÁRIO -->
        <div class="user-box">
          <span nz-icon nzType="user"></span>
          <span class="username">Olá, usuário visitante</span>
        </div>

        <!-- LOGOUT -->
        <button nz-button nzType="link" (click)="handlerLogOut()">
          Sair
        </button>

      </div>

    </nz-header>

    <!-- CONTENT -->
    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>

  </nz-layout>

</nz-layout>
