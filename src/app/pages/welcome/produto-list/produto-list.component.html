<div class="container-fluid">
    <div class="row mb-4">
      <div class="col-12">
        <nz-card nzTitle="Filtros" [nzBordered]="false" [formGroup]="formProdutoFilter">
           <div class="row">
            <div class="col-md-3 mb-3">
              <label nz-typography>Filtrar por Categoria:</label>
              <nz-select
                formControlName="categoria"
                nzPlaceHolder="Selecione uma categoria"
                nzAllowClear
                style="width: 100%">
                <nz-option nzValue="null" nzLabel="Todas as categorias"></nz-option>
                <nz-option 
                  *ngFor="let categoria of categorias | keyvalue" 
                  [nzValue]="categoria.value" 
                  [nzLabel]="categoria.value">
                </nz-option>
              </nz-select>
            </div>

            <div class="col-md-3 mb-3">
              <label nz-typography>Preço Mínimo:</label>
              <nz-input-number
                formControlName="precoMinimo"
                nzPlaceHolder="Preço mínimo"
                [nzMin]="0"
                [nzStep]="0.01"
                style="width: 100%">
              </nz-input-number>
            </div>

            <div class="col-md-3 mb-3">
              <label nz-typography>Preço Máximo:</label>
              <nz-input-number
                formControlName="precoMaximo"
                nzPlaceHolder="Preço máximo"
                [nzMin]="0"
                [nzStep]="0.01"
                style="width: 100%">
              </nz-input-number>
            </div>

            <div class="col-md-3 mb-3 d-flex align-items-end">
              <button 
                nz-button 
                nzType="default" 
                nzSize="large"
                (click)="limparFiltros()"
                style="width: 100%">
                <i nz-icon nzType="clear" nzTheme="outline"></i>
                Limpar Filtros
              </button>
            </div>
          </div>
        </nz-card>
      </div>
    </div>
    <div class="row">
      @for (item of listaProdutos; track $index) {
        <div class="col-md-6 col-lg-4 mb-4">
          <nz-card nzHoverable>
            <!-- <nz-carousel> -->
              @for(img of item.imagens; track img.id){
                <div nz-carousel-content>
                  <img [src]="viewImage(img)" />
                </div>
              }
            <!-- </nz-carousel> -->
            <nz-card-meta class="card-description" [nzTitle]="item.nome" [nzDescription]="item.descricao" />
            <button nz-button nzType="primary" nzShape="round" (click)="detalharProduto(item)">
              detalhes
            </button>
          </nz-card>
        </div>
      }
    </div>
    <nz-pagination 
      [nzPageIndex]="pageIndex" 
      [nzPageSize]="pageSize"
      [nzTotal]="totalElements" 
      (nzPageIndexChange)="searchDataPage($event)"
      (nzPageSizeChange)="searchDataSize($event)"
    />  
</div>
