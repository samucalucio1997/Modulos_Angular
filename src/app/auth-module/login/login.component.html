<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Bem-vindo</h2>
      <p>Faça login em sua conta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Digite seu email" class="form-control"
          [class.error]="email?.invalid && email?.touched" />
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-input-container">
          <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
            placeholder="Digite sua senha" class="form-control"
            [class.error]="password?.invalid && password?.touched" />
          <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
            <span *ngIf="!showPassword">👁️</span>
            <span *ngIf="showPassword">🙈</span>
          </button>
        </div>
        <div class="error-messages" *ngIf="password?.invalid && password?.touched">
          <small *ngIf="password?.errors?.['required']">Senha é obrigatória</small>
          <small *ngIf="password?.errors?.['minlength']">Senha deve ter pelo menos 6 caracteres</small>
        </div>
      </div>

      <!-- Opções adicionais -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" />
          <span class="checkmark"></span>
          Lembrar-me
        </label>
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </div>

      <!-- Aqui o botão de autenticar com o google-->
      <button nz-button nzType="default" nzBlock class="google-login-button" (click)="loginWithGoogle()">
        <span nz-icon nzType="google" nzTheme="fill" class="google-icon"></span>
        Entrar com Google
      </button>
     
      <!-- Botão de Login -->
      <button type="submit" class="login-button" [disabled]="isLoading" [class.loading]="isLoading">
        <span *ngIf="!isLoading">Entrar</span>
        <span *ngIf="isLoading">
          <span class="spinner"></span>
          Entrando...
        </span>
      </button>

      <!-- Link para registro -->
      <div class="register-link">
        <p>Não tem uma conta? <a href="#">Registre-se aqui</a></p>
      </div>
    </form>
    <ng-container *ngIf="false">
      <!-- <nz-alert
      nzType="success"
      nzMessage="Success Tips"
      nzDescription="Detailed description and advices about successful copywriting."
      nzShowIcon
    ></nz-alert> -->
    </ng-container>
  </div>
</div>
