<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Bem-vindo</h2>
      <p>Faça login em sua conta</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="Digite seu email"
          class="form-control"
          [class.error]="email?.invalid && email?.touched"
        />
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-input-container">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Digite sua senha"
            class="form-control"
            [class.error]="password?.invalid && password?.touched"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            <span *ngIf="!showPassword">👁️</span>
            <span *ngIf="showPassword">🙈</span>
          </button>
        </div>
        <div class="error-messages" *ngIf="password?.invalid && password?.touched">
          <small *ngIf="password?.errors?.['required']">Senha é obrigatória</small>
          <small *ngIf="password?.errors?.['minlength']">Senha deve ter pelo menos 6 caracteres</small>
        </div>
      </div>

      <!-- Opções adicionais -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" />
          <span class="checkmark"></span>
          Lembrar-me
        </label>
        <a href="#" class="forgot-password">Esqueceu a senha?</a>
      </div>
      <!-- Social Login Options -->
      <div class="social-login">
        <button 
          nz-button 
          nzType="default" 
          nzSize="large" 
          nzBlock
          type="button" 
          (click)="loginWithGoogle()"
          class="social-button google-button"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Entrar com Google
        </button>
      </div>

      <!-- Botão de Login -->
      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
        [class.loading]="isLoading"
      >
        <span *ngIf="!isLoading">Entrar</span>
        <span *ngIf="isLoading">
          <span class="spinner"></span>
          Entrando...
        </span>
      </button>

      <!-- Link para registro -->
      <div class="register-link">
        <p>Não tem uma conta? <a href="#">Registre-se aqui</a></p>
      </div>
    </form>
    <ng-container *ngIf="false">
      <!-- <nz-alert
      nzType="success"
      nzMessage="Success Tips"
      nzDescription="Detailed description and advices about successful copywriting."
      nzShowIcon
    ></nz-alert> -->
    </ng-container>
  </div>
</div>
