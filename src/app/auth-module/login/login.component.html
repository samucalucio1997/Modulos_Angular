<div class="login-container">
  <div class="row g-0 h-100">

    <!-- LADO ESQUERDO -->
    <div class="col-md-6 d-none d-md-flex left-panel">
      <div class="branding">
        <h1>StockFlow</h1>
        <p class="subtitle">Gerencie seu estoque com eficiência</p>

        <ul>
          <li>Controle em tempo real</li>
          <li>Gestão de pedidos</li>
          <li>Relatórios inteligentes</li>
        </ul>
      </div>
    </div>

    <!-- LADO DIREITO -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="login-card">

        <div class="login-header">
          <h2>Bem-vindo</h2>
          <p>Acesse sua conta para continuar</p>
        </div>

        <div class="login-actions">
          <!-- BOTÃO LOGIN -->
          <button
            class="login-button"
            [disabled]="isLoading"
            [class.loading]="isLoading"
            (click)="onLogin()">

            <span *ngIf="!isLoading">Entrar</span>

            <span *ngIf="isLoading">
              <span class="spinner"></span>
              Redirecionando...
            </span>
          </button>

          <!-- INFORMAÇÃO -->
          <div class="info-text">
            <p>
              Você será redirecionado para uma página segura
              para realizar a autenticação.
            </p>
          </div>

          <!-- DIVISOR -->
          <div class="divider">
            <span>ou</span>
          </div>

          <!-- LINK REGISTRO -->
          <div class="register-link">
            <p>Não tem uma conta? <a routerLink="/auth/register">Registre-se</a></p>
          </div>
        </div>

      </div>
    </div>

  </div>
</div>
