<div class="login-container">
  <div class="row g-0 h-100">

    <!-- LADO ESQUERDO -->
    <div class="col-md-6 d-none d-md-flex left-panel">
      <div class="branding">
        <h1>StockFlow</h1>
        <p class="subtitle">Gerencie seu estoque com eficiência</p>

        <ul>
          <li>Controle em tempo real</li>
          <li>Gestão de pedidos</li>
          <li>Relatórios inteligentes</li>
        </ul>
      </div>
    </div>

    <!-- LADO DIREITO -->
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div class="login-card">

        <div class="login-header">
          <h2>Bem-vindo</h2>
          <p>Acesse sua conta para continuar</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

          <!-- USUÁRIO -->
          <div class="form-group">
            <label for="username">Usuário</label>
            <div class="input-with-icon">
              <input id="username" type="text" formControlName="username"
                placeholder="Digite seu usuário ou email"
                [class.error]="username?.invalid && username?.touched" />
            </div>
            <div class="error-messages" *ngIf="username?.invalid && username?.touched">
              <small *ngIf="username?.errors?.['required']">Usuário é obrigatório</small>
            </div>
          </div>

          <!-- SENHA -->
          <div class="form-group">
            <label for="password">Senha</label>

            <div class="input-with-icon">
              <input id="password"
                [type]="showPassword ? 'text' : 'password'"
                formControlName="password"
                placeholder="Digite sua senha"
                [class.error]="password?.invalid && password?.touched" />

              <button type="button" class="password-toggle"
                (click)="togglePasswordVisibility()" tabindex="-1">
                <span *ngIf="!showPassword">&#128065;</span>
                <span *ngIf="showPassword">&#128584;</span>
              </button>
            </div>

            <div class="error-messages" *ngIf="password?.invalid && password?.touched">
              <small *ngIf="password?.errors?.['required']">Senha é obrigatória</small>
            </div>
          </div>

          <!-- OPÇÕES -->
          <div class="form-options">
            <label class="checkbox-container">
              <input type="checkbox" />
              <span class="checkmark"></span>
              Lembrar-me
            </label>
          </div>

          <!-- BOTÃO LOGIN -->
          <button type="submit"
            class="login-button"
            [disabled]="isLoading"
            [class.loading]="isLoading">

            <span *ngIf="!isLoading">Entrar</span>

            <span *ngIf="isLoading">
              <span class="spinner"></span>
              Entrando...
            </span>
          </button>

          <!-- REGISTRO -->
          <div class="register-link">
            <p>Não tem uma conta? <a routerLink="/auth/register">Registre-se</a></p>
          </div>

        </form>

      </div>
    </div>

  </div>
</div>
